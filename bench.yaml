source_arch: x86_64
target_arch: ppc64le
suite: easy
label: run30
repeats: 1

model: deepseek/deepseek-v4.1-flash
provider: streamlake/fp8
temperature:

llm:
  max_build_attempts: 12
  max_tool_rounds: 60
  extra_tools: [search_files_tool, replace_in_file_tool, run_command_tool]
  max_context_chars: 600000
  keep_recent_tool_results: 8
  repeat_guard_per_build: true
  empty_reply_retries: 2
  prompt_cache: auto
  text_tool_calls: true
  carry_notes_chars: 4000
  round_notice_at: [30, 10, 5]
  build_drought_rounds: 15
  repeated_failure_note: true

build:
  backend: obs
  local:
    jobs: 0
  script:
    jobs: 0
    build_original_on_init: true
    experiment_paths: []
    experiment_hide: []
  container:
    build_network: log

obs:
  max_wait_seconds: 14400
  check_interval: 30

acceptance:
  timeout_seconds: 3600

suites:
  easy: [cpufetch, fermi-lite, libzita-resampler, lite-xl-plugin-manager, minigraph, ssw]
  medium: [asl, ksw2, minimap2, miniprot]
  hard: [jaxlib, tensorflow]
