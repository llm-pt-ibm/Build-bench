source_arch: x86_64
target_arch: ppc64le
suite: easy
label: run30
repeats: 1

model: deepseek/deepseek-v4.1-flash
provider: streamlake/fp8
temperature:

llm:
  max_build_attempts: 12
  max_tool_rounds: 60
  extra_tools: true
  max_context_chars: 600000
  keep_recent_tool_results: 8
  repeat_guard_per_build: true
  empty_reply_retries: 2
  prompt_cache: auto
  text_tool_calls: true
  carry_notes_chars: 4000
  round_notices: true
  build_drought_note: true
  repeated_failure_note: true

build:
  backend: obs
  local:
    jobs: 0
  script:
    jobs: 0
    build_original_on_init: true
    experiment_paths: []
    experiment_hide: []
  container:
    build_network: log

obs:
  max_wait_seconds: 14400
  check_interval: 30

acceptance:
  timeout_seconds: 3600

suites:
  easy: [cpufetch, fermi-lite, libzita-resampler, lite-xl-plugin-manager, minigraph, ssw]
  medium: [asl, ksw2, minimap2, miniprot]
  hard: [jaxlib, tensorflow]
  # the evaluation sample of 2026-11-13 (dataset/sample_x86_64_to_ppc64le.json)
  sample: [trigger-rally, rtlsdr-airband, bngblaster, librealsense, xtensor-python,
           libbullet, schismtracker, dav2d, clanlib, samply, syncterm, ImHex,
           noise-suppression-for-voice, connman, wl-screenrec, qcoan,
           json-schema-validator, awww, rustdesk-server, python-mitmproxy-wireguard,
           steampipe, inspektor-gadget, ptcpdump, kluctl, kpt-cli, backward-cpp,
           libvarlink, lpcnet, iprange, bash-completion-doc, python-PySDL2, kismet,
           dealii]
  # one case of each group of the sample, the quickest with the plainest evidence
  groups: [rtlsdr-airband, dav2d, clanlib, syncterm, json-schema-validator, awww, steampipe,
           backward-cpp]
