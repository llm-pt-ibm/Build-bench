LLM_PROVIDER: "openai"
source_arch: "x86_64"
target_arch: "ppc64le"

paths:
  base_dir: "data/x86_64_to_ppc64le"
  result_dir: "result_text_res/x86_64_to_ppc64le_local"
  temp_work_dir: "temp_workspace"
  log_dir: "result_log_res/x86_64_to_ppc64le_local"

user:
  target_project: "home:{user}:build-bench"
  repository_name: "ppc64le"
  architecture_name: "ppc64le"
  obs_api_url: "https://api.opensuse.org"

# Build locally with osc in the worker created by scripts/local_worker/setup.sh,
# resolving dependencies against openSUSE:Factory:PowerPC like OBS does.
build:
  backend: "local"
  local:
    worker_root: "/root/obs-worker"
    project: "openSUSE:Factory:PowerPC"
    repository: "standard"
    arch: "ppc64le"
    jobs: 0          # 0: one job per 5 GB of available memory, at most nproc

obs:
  max_wait_seconds: 21600   # large packages (e.g. python-torch) take hours
  check_interval: 30
