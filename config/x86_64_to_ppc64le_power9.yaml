LLM_PROVIDER: "openai"
source_arch: "x86_64"
target_arch: "ppc64le"

paths:
  base_dir: "data/x86_64_to_ppc64le"
  result_dir: "result_text_res/x86_64_to_ppc64le_power9"
  temp_work_dir: "temp_workspace"
  log_dir: "result_log_res/x86_64_to_ppc64le_power9"

user:
  target_project: "home:{user}:build-bench"
  repository_name: "ppc64le"
  architecture_name: "ppc64le"
  obs_api_url: "https://api.opensuse.org"

# Every build runs on this Power9 host, for any kind of package:
# - RPM packages (.spec): osc build in the local worker (scripts/local_worker),
#   against openSUSE:Factory:PowerPC like OBS;
# - build-recipe cases (build.sh): the recipe runs on the host, in the build
#   environment the case declares (envs/), with a persistent build cache.
build:
  backend: "local"
  local:
    worker_root: "/root/obs-worker"
    project: "openSUSE:Factory:PowerPC"
    repository: "standard"
    arch: "ppc64le"
    jobs: 0          # 0: one job per 5 GB of available memory, at most nproc
  script:
    stage_root: "/root/obs-worker/script"
    jobs: 0
    # start each run from a clean per-run build cache and build the original
    # package before the first attempt (the shared caches are kept)
    build_original_on_init: true
    # run_command_tool's sandbox shows the case's build environment
    # (BENCH_HOME/envs/<name>, made by make setup-env) by itself; paths of the
    # host an environment needs besides go here, read-only, and directories
    # inside them to keep hidden in experiment_hide. Until the user-space
    # environments, the old jax-power9 lived in /root/miniforge3, whose
    # jax_build environment had the team's manual jaxlib installed.
    experiment_paths: []
    experiment_hide: []
  # build.sh, acceptance tests and run_command_tool's commands run in a
  # container of the build environment's image (envs/<name>/Containerfile,
  # built by make setup-env): podman (default), docker, or none (on the host)
  container:
    runtime: podman
    build_network: host       # builds download their dependencies; tests and commands get none

# Extensions for large code bases
llm:
  max_tool_rounds: 60            # per attempt (20 in the paper); attempts stay 3
  extra_tools: ["search_files_tool", "replace_in_file_tool", "run_command_tool"]
  max_context_chars: 600000
  keep_recent_tool_results: 8
  repeat_guard_per_build: true   # repair cycles per attempt are not capped at 3
  round_notice_at: [30, 10, 5]   # tell the model when 30, 10 and 5 rounds are left
  carry_notes_chars: 4000        # the next attempt gets the model's notes
  empty_reply_retries: 2         # an empty model reply is retried, not taken as "done"

obs:
  max_wait_seconds: 14400   # large packages take hours from a cold cache
  check_interval: 30
