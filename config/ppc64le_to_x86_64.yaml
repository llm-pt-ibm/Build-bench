# Sentido: compila em ppc64le, falha em x86_64. O reparo é validado no repositório x86_64.
# Credenciais ficam no .env (OBS_USER / OBS_PASSWORD), nunca aqui.
LLM_PROVIDER: "openai"   # API compatível com OpenAI (OpenRouter)
source_arch: "ppc64le"
target_arch: "x86_64"

paths:
  base_dir: "data/ppc64le_to_x86_64"
  result_dir: "result_text_res/ppc64le_to_x86_64"
  temp_work_dir: "temp_workspace"
  log_dir: "result_log_res/ppc64le_to_x86_64"

user:
  target_project: "home:{user}:build-bench"
  repository_name: "x86_64"
  architecture_name: "x86_64"
  obs_api_url: "https://api.opensuse.org"

obs:
  max_wait_seconds: 3600   # builds grandes (llamacpp) passam de 10 min
  check_interval: 30
