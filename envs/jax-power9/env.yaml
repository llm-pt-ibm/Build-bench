# Build environment of the jaxlib case: what an x86_64 build host gets from
# upstream binaries, which do not exist for ppc64le. make setup-env makes it
# (tools/auto_repair/build_env.py); build.lock and tools.lock hold the exact
# packages it was set up with.

# Python and NumPy/SciPy, and clang 17: the host's gcc 8.5 is too old. clang
# compiles C++ against the libstdc++ headers of conda's GCC, and clang 17 fails
# on GCC 16's ("member access into incomplete type __normal_iterator"): GCC 15's
conda: [python=3.12.13, numpy=2.5.1, scipy=1.18.0, pip, setuptools, wheel, packaging,
        clang=17.0.6, clangxx=17.0.6, lld=17.0.6,
        libgcc-devel_linux-ppc64le=15.2.0, libstdcxx-devel_linux-ppc64le=15.2.0]
# what Bazel needs on the host, apart: current openjdk builds and LLVM 17 need
# conflicting versions of icu
tools: [openjdk=21.0.10, zip, unzip, patch, git, which, diffutils]
bazel: 7.7.0
# at the versions jax 0.10.2's requirements pin; PyPI has no ppc64le wheel of
# numpy 2.0.2 and ml-dtypes 0.5.4 (built from their sources, a few minutes)
wheels: [numpy==2.0.2, ml-dtypes==0.5.4, zstandard==0.25.0]
build_pip: [ml-dtypes, opt-einsum==3.4.0]
# the acceptance test runs JAX's test suite with pytest (no jax installed: the
# test installs the wheel it checks)
test_pip: [ml-dtypes, pytest==9.1.1, pytest-xdist==3.8.0, absl-py==2.5.1, hypothesis==6.169.1, opt-einsum==3.4.0]
