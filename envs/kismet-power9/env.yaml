# Build environment of kismet (dataset/sample_x86_64_to_ppc64le.json): autotools
# with the libraries Kismet and its capture tools link (pcap, netlink, USB,
# websockets, MQTT...), which an x86_64 build host gets from its distribution.
# make setup-env makes it; build.lock holds the exact packages it was set up
# with.

conda: [gcc=16.2.0, gxx=16.2.0, make, autoconf, automake, libtool, pkg-config,
        libcap, libpcap, xz, mosquitto, libnl, pcre2, libwebsockets, zstd,
        sqlite, zlib, openssl, libusb, rtl-sdr, protobuf-c, protobuf,
        python=3.12, setuptools]

# the compilers by their plain names, the environment's headers and libraries
# for the compiler and pkg-config, and their directory in the executable's
# runpath (conda's activation scripts, which set these, are not run); -pthread
# because the sysroot's glibc (2.28) keeps the threads in libpthread, where a
# current distribution has them in libc
env:
  CC: gcc
  CXX: g++
  CPATH: $BENCH_ENV_DIR/build/include
  LIBRARY_PATH: $BENCH_ENV_DIR/build/lib
  PKG_CONFIG_PATH: $BENCH_ENV_DIR/build/lib/pkgconfig:$BENCH_ENV_DIR/build/share/pkgconfig
  LDFLAGS: -pthread -Wl,-rpath,$BENCH_ENV_DIR/build/lib
