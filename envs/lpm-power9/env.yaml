# Build environment of lite-xl-plugin-manager: Meson with the libraries lpm
# links (libgit2, mbedtls, libzip, Lua, liblzma, zlib), which an x86_64 build
# host gets from its distribution. make setup-env makes it; build.lock holds
# the exact packages it was set up with.

conda: [gcc=15.2.0, meson, ninja, pkg-config,
        zlib, xz, libzip, libgit2, mbedtls=3.6.3.1, lua=5.4]

# the compiler by its plain name, pkg-config's view of the environment's
# libraries, and their directory in the executable's runpath (conda's
# activation scripts, which set these, are not run)
env:
  CC: gcc
  PKG_CONFIG_PATH: $BENCH_ENV_DIR/build/lib/pkgconfig
  LDFLAGS: -Wl,-rpath,$BENCH_ENV_DIR/build/lib
