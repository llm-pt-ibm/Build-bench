# Build environment of the Rust cases of the evaluation sample
# (dataset/sample_x86_64_to_ppc64le.json, env rust-power9): Cargo with the
# vendored crates of each case (no network), the C compilers and tools the
# crates' build scripts use, and the system libraries the cases link, which an
# x86_64 build host gets from its distribution. make setup-env makes it;
# build.lock holds the exact packages it was set up with.

conda: [rust, gcc=16.2.0, gxx=16.2.0, make, cmake, ninja, pkg-config, perl,
        clang, libclang, corrosion, scdoc,
        openssl, zlib, lz4-c, libuuid, alsa-lib, dbus, pulseaudio-client,
        ffmpeg, libdrm, wayland, wayland-protocols, libxkbcommon,
        libvulkan-headers, libvulkan-loader,
        python=3.12, pip, maturin, setuptools-rust, wheel, pytest]

# the compilers by their plain names, Cargo's linker for ppc64le, the
# environment's headers and libraries for the compiler, pkg-config and CMake,
# and their directory in the executable's runpath (conda's activation scripts,
# which set these, are not run); -pthread because the sysroot's glibc (2.28)
# keeps the threads in libpthread, where a current distribution has them in libc
env:
  CC: gcc
  CXX: g++
  CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER: gcc
  LIBCLANG_PATH: $BENCH_ENV_DIR/build/lib
  CPATH: $BENCH_ENV_DIR/build/include
  LIBRARY_PATH: $BENCH_ENV_DIR/build/lib
  PKG_CONFIG_PATH: $BENCH_ENV_DIR/build/lib/pkgconfig:$BENCH_ENV_DIR/build/share/pkgconfig
  CMAKE_PREFIX_PATH: $BENCH_ENV_DIR/build
  LDFLAGS: -pthread -Wl,-rpath,$BENCH_ENV_DIR/build/lib
