# Build environment of the Go cases of the evaluation sample
# (dataset/sample_x86_64_to_ppc64le.json, env go-power9): Go with the vendored
# modules of each case (no network), the C compiler for cgo, clang and LLVM
# for the eBPF programs ptcpdump compiles, and libpcap, which an x86_64 build
# host gets from its distribution. make setup-env makes it; build.lock holds
# the exact packages it was set up with.

conda: [go=1.27, gcc=16.2.0, gxx=16.2.0, make, pkg-config, git,
        clang, llvm-tools, libpcap]

# the compilers by their plain names, Go without toolchain downloads or a
# module proxy, the environment's headers and libraries for the compiler, cgo
# and pkg-config, and their directory in the executable's runpath (conda's
# activation scripts, which set these, are not run)
env:
  CC: gcc
  CXX: g++
  GOTOOLCHAIN: local
  GOPROXY: "off"
  CPATH: $BENCH_ENV_DIR/build/include
  LIBRARY_PATH: $BENCH_ENV_DIR/build/lib
  PKG_CONFIG_PATH: $BENCH_ENV_DIR/build/lib/pkgconfig:$BENCH_ENV_DIR/build/share/pkgconfig
  CGO_LDFLAGS: -Wl,-rpath,$BENCH_ENV_DIR/build/lib
  LDFLAGS: -Wl,-rpath,$BENCH_ENV_DIR/build/lib
