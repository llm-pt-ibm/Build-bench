# Build environment of the small C and C++ tools built with make (asl, bwa,
# cpufetch, fermi-lite, libzita-resampler, minigraph, minimap2, miniprot, ssw):
# a compiler, make and zlib, which an x86_64 build host gets from its
# distribution. make setup-env makes it; build.lock holds the exact packages
# it was set up with.

conda: [gcc=15.2.0, gxx=15.2.0, make, zlib]

# the compilers by their plain names, and the environment's headers and
# libraries (conda's activation scripts, which set these, are not run)
env:
  CC: gcc
  CXX: g++
  CPATH: $BENCH_ENV_DIR/build/include
  LIBRARY_PATH: $BENCH_ENV_DIR/build/lib
  LDFLAGS: -Wl,-rpath,$BENCH_ENV_DIR/build/lib
