# Build environment of the tensorflow case: what an x86_64 build host gets
# from upstream binaries and the Power9 lacks.

# Python 3.12 and clang 17: the host's gcc 8.5 is too old. clang compiles C++
# against the libstdc++ headers of conda's GCC, and clang 17 fails on GCC 16's
# ("member access into incomplete type __normal_iterator"): GCC 15's. HDF5 and
# OpenSSL for the wheels of h5py and grpcio.
conda: [python=3.12, numpy, pip, setuptools, wheel, packaging,
        clang=17.0.6, clangxx=17.0.6, lld=17.0.6,
        libgcc-devel_linux-ppc64le=15.2.0, libstdcxx-devel_linux-ppc64le=15.2.0,
        hdf5=1.14, openssl]
# h5py builds against conda's HDF5; grpcio against conda's OpenSSL, since the
# BoringSSL it bundles has no ppc64le ("Unknown target CPU")
env: {HDF5_DIR: $BENCH_ENV_DIR/build, GRPC_PYTHON_BUILD_SYSTEM_OPENSSL: "1"}
# what Bazel needs, apart: current openjdk builds and LLVM 17 need conflicting versions of icu
tools: [openjdk=21, zip, unzip, patch, git, which, diffutils]
# the Bazel TensorFlow 2.21 asks for; none is published for ppc64le
bazel: 7.7.0
# ppc64le wheels at the versions TensorFlow 2.21 pins (requirements_lock_3_12.txt); PyPI has none
wheels: [numpy==2.1.3, ml-dtypes==0.5.1, h5py==3.13.0, grpcio==1.71.0,
         wrapt==1.16.0, optree==0.16.0, psutil==7.0.0, zstandard==0.23.0]
# what the acceptance test imports (it runs without network), at the versions of the same lock
test_pip: [numpy, ml-dtypes, h5py, grpcio, wrapt, optree, psutil, zstandard,
           pytest==9.1.1, absl-py==2.2.2, astunparse==1.6.3, flatbuffers==25.9.23, gast==0.4.0,
           google-pasta==0.2.0, keras==3.12.1, namex==0.0.9, opt-einsum==3.3.0, packaging==23.2,
           protobuf==6.31.1, requests==2.32.4, rich==14.0.0, six==1.17.0, termcolor==2.3.0,
           typing-extensions==4.14.1]
