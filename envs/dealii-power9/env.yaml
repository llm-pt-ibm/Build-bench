# Build environment of dealii (dataset/sample_x86_64_to_ppc64le.json): CMake
# and the C++ compiler, with LAPACK and zlib; deal.II's own copies of Boost,
# Kokkos and Taskflow, which it bundles, stand for the distribution's. make
# setup-env makes it; build.lock holds the exact packages it was set up with.

conda: [gcc=16.2.0, gxx=16.2.0, make, cmake, ninja, pkg-config,
        zlib, openblas, liblapack, python=3.12]

# the compilers by their plain names, the environment's headers and libraries
# for the compiler and CMake, and their directory in the executable's runpath
# (conda's activation scripts, which set these, are not run); -pthread because
# the sysroot's glibc (2.28) keeps the threads in libpthread, where a current
# distribution has them in libc
env:
  CC: gcc
  CXX: g++
  CPATH: $BENCH_ENV_DIR/build/include
  LIBRARY_PATH: $BENCH_ENV_DIR/build/lib
  CMAKE_PREFIX_PATH: $BENCH_ENV_DIR/build
  LDFLAGS: -pthread -Wl,-rpath,$BENCH_ENV_DIR/build/lib
