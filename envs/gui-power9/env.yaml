# Build environment of the graphical cases of the evaluation sample
# (dataset/sample_x86_64_to_ppc64le.json, env gui-power9): make, CMake and
# autotools with SDL, OpenGL, X11, audio and the other libraries those cases
# link, which an x86_64 build host gets from its distribution. make setup-env
# makes it; build.lock holds the exact packages it was set up with.

conda: [gcc=16.2.0, gxx=16.2.0, make, cmake, ninja, pkg-config, autoconf,
        automake, libtool, dos2unix, patch, git, unzip, doxygen,
        zlib, libpng, libjpeg-turbo, freetype, fontconfig, libxml2, sqlite,
        libcurl, libusb, libudev, libarchive, libssh2, mbedtls, fmt,
        nlohmann_json, yaml-cpp, libmagic, llvmdev, dbus, capstone,
        sdl2, sdl2_image, sdl2_mixer, sdl3, openal-soft, glew, libglu,
        freeglut, glfw, libgl-devel, libegl-devel, libopengl-devel,
        xorg-libx11, xorg-libxinerama, xorg-libxcursor, xorg-libxext,
        xorg-libxrandr, tinyxml2, alsa-lib, libflac, libutf8proc, libvorbis,
        libogg, epoxy, cunit, libxmp, opusfile, imagemagick,
        python=3.12, numpy]

# the libraries conda-forge lacks for ppc64le, compiled into the environment:
# physfs and freealut (trigger-rally), enet, argtable3 and libconfuse (openomf;
# conda-forge's confuse is a Python package)
setup:
  - curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 https://github.com/icculus/physfs/archive/refs/tags/release-3.2.0.tar.gz | tar xz
  - cmake -S physfs-release-3.2.0 -B physfs-build -DCMAKE_INSTALL_PREFIX=$BENCH_ENV_DIR/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DPHYSFS_BUILD_TEST=OFF -DPHYSFS_BUILD_DOCS=OFF && cmake --build physfs-build -j8 --target install
  - curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 https://github.com/vancegroup/freealut/archive/refs/tags/freealut_1_1_0.tar.gz | tar xz
  - cmake -S freealut-freealut_1_1_0 -B freealut-build -DCMAKE_INSTALL_PREFIX=$BENCH_ENV_DIR/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF && cmake --build freealut-build -j8 --target install
  - curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 https://github.com/lsalzman/enet/archive/refs/tags/v1.3.18.tar.gz | tar xz
  - cd enet-1.3.18 && autoreconf -fi && ./configure --prefix=$BENCH_ENV_DIR/build --disable-static && make -j8 install
  - curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 https://github.com/argtable/argtable3/archive/refs/tags/v3.2.2.f25c624.tar.gz | tar xz
  - cmake -S argtable3-3.2.2.f25c624 -B argtable3-build -DCMAKE_INSTALL_PREFIX=$BENCH_ENV_DIR/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_SHARED_LIBS=ON -DARGTABLE3_ENABLE_TESTS=OFF -DARGTABLE3_ENABLE_EXAMPLES=OFF && cmake --build argtable3-build -j8 --target install
  - curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.xz | tar xJ
  - cd confuse-3.3 && ./configure --prefix=$BENCH_ENV_DIR/build --disable-static --disable-examples && make -j8 install

# the compilers by their plain names, the environment's headers and libraries
# for the compiler, pkg-config and CMake, and their directory in the
# executable's runpath (conda's activation scripts, which set these, are not
# run); -pthread because the sysroot's glibc (2.28) keeps the threads in
# libpthread, where a current distribution has them in libc
env:
  CC: gcc
  CXX: g++
  CPATH: $BENCH_ENV_DIR/build/include
  LIBRARY_PATH: $BENCH_ENV_DIR/build/lib
  PKG_CONFIG_PATH: $BENCH_ENV_DIR/build/lib/pkgconfig:$BENCH_ENV_DIR/build/share/pkgconfig
  CMAKE_PREFIX_PATH: $BENCH_ENV_DIR/build
  LDFLAGS: -pthread -Wl,-rpath,$BENCH_ENV_DIR/build/lib
