# Build environment of the Python cases of the evaluation sample
# (dataset/sample_x86_64_to_ppc64le.json, env py-power9): Python with the
# packages those cases build against and test with (no network), CMake and
# the C++ compilers for the extension modules, and the libraries they bind
# (SDL, Tesseract), which an x86_64 build host gets from its distribution.
# make setup-env makes it; build.lock holds the exact packages it was set up
# with.

conda: [python=3.12, pip, setuptools, setuptools-scm, wheel, cython, pytest,
        numpy, scipy, h5py, pillow, cysignals, pyyaml, lxml, matplotlib-base,
        pandas, pydot, pygraphviz, pyparsing, graphviz,
        gcc=16.2.0, gxx=16.2.0, make, cmake, ninja, pkg-config,
        pybind11, xtensor, gtest, eigen, tsl_robin_map,
        tesseract, libcurl, sdl2, sdl2_image, sdl2_mixer, sdl2_ttf, sdl3]

# the compilers by their plain names, the environment's headers and libraries
# for the compiler, pkg-config and CMake, and their directory in the
# executable's runpath (conda's activation scripts, which set these, are not
# run); -pthread because the sysroot's glibc (2.28) keeps the threads in
# libpthread, where a current distribution has them in libc
env:
  CC: gcc
  CXX: g++
  CPATH: $BENCH_ENV_DIR/build/include
  LIBRARY_PATH: $BENCH_ENV_DIR/build/lib
  PKG_CONFIG_PATH: $BENCH_ENV_DIR/build/lib/pkgconfig:$BENCH_ENV_DIR/build/share/pkgconfig
  CMAKE_PREFIX_PATH: $BENCH_ENV_DIR/build
  LDFLAGS: -pthread -Wl,-rpath,$BENCH_ENV_DIR/build/lib
