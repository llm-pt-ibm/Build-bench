# Example of a build environment, with every key: make new-env ENV=<name>
# copies it to envs/<name>/env.yaml. Uncomment what the package needs, adjust
# the values, then make setup-env ENV=<name>. Every key is optional (at least
# one is needed); tools/auto_repair/build_env.py describes them.

# conda packages of the build environment: the compilers, build tools,
# libraries and interpreters the package's build.sh uses; pinned versions make
# it exact. For other build systems, for example:
#   CMake      [cmake, ninja, cxx-compiler]
#   autotools  [autoconf, automake, libtool, make, pkg-config]
#   Meson      [meson, ninja, pkg-config]
#   Rust       [rust]           Go  [go]
#   Java       [openjdk, maven] Node.js  [nodejs]
#   Python     [python=3.12, pip, setuptools, wheel]
# cxx-compiler is conda-forge's GCC. A clang compiles C++ against the libstdc++
# headers of conda's GCC: pin them to a version it supports, e.g. clang 17 with
# GCC 15's: [clang=17.0.6, clangxx=17.0.6, libstdcxx-devel_linux-ppc64le=15.2.0]
conda: [cxx-compiler, cmake, ninja, make, python=3.12]

# conda channels, in this order (default: conda-forge)
# channels: [conda-forge]

# a second conda environment, for tools whose dependencies conflict with the
# build environment's (Java for Bazel next to LLVM 17, for example)
# tools: [openjdk=21, zip, unzip, patch, git]

# RHEL 8 packages (dnf) added to the image the builds run in, for what conda lacks
# system: [zlib-devel, openssl-devel]

# variables exported to builds, tests and commands; $BENCH_ENV_DIR is the
# environment's directory
# env:
#   CC: clang
#   CMAKE_PREFIX_PATH: $BENCH_ENV_DIR/build

# commands run once at the end of make setup-env, in the environment's
# directory with its tools in PATH, for what no other key covers, e.g. a tool
# compiled from its sources into $BENCH_ENV_DIR/bin
# setup:
#   - curl -fsSL https://example.org/tool-1.0.tar.gz | tar xz
#   - make -C tool-1.0 install PREFIX=$BENCH_ENV_DIR

# Bazel, compiled from its sources (none is published for ppc64le), once per
# machine and shared by the environments ($BAZEL); it needs Java (tools)
# bazel: 7.7.0
# bazel_bootstrap: 7.1.0   # an older Bazel to build it with, when its own bootstrap fails

# Python packages, which need a Python in conda: wheels PyPI lacks for this
# architecture, built with the environment's compilers ($LOCAL_WHEELS), and
# pip packages of the build environment and of the test environment (a copy
# of the build environment, where the acceptance test runs without network);
# a name among wheels is installed from its wheel
# wheels: [numpy==2.1.3]
# build_pip: [numpy]
# test_pip: [numpy, pytest==9.1.1]
