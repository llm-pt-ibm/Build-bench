# Build environment of the C and C++ cases of the evaluation sample
# (dataset/sample_x86_64_to_ppc64le.json, env c-power9): make, CMake, Meson
# and autotools with the libraries those cases link, which an x86_64 build
# host gets from its distribution. make setup-env makes it; build.lock holds
# the exact packages it was set up with.

conda: [gcc=16.2.0, gxx=16.2.0, make, cmake, ninja, meson, pkg-config,
        autoconf, automake, libtool, bison, flex,
        zlib, zstd, lz4-c, ncurses, readline, libedit, openssl, gnutls, libxcrypt,
        libffi, elfutils, libunwind, libcap, libuuid, glib, dbus,
        libboost-devel, eigen, nlohmann_json, yaml-cpp, jansson, pcre, sqlite,
        gtest, cmocka, nasm, ragel, libpcap, rtl-sdr, soapysdr, libconfig,
        lame, fftw, libogg, libvorbis, libprotobuf, protobuf, patch, dos2unix,
        python=3.12, pytest, pexpect]


# the libraries conda-forge lacks for ppc64le, compiled into the environment:
# libshout (rtlsdr-airband), libdict (bngblaster), libmnl and libnftnl (connman)
setup:
  - curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 https://downloads.xiph.org/releases/libshout/libshout-2.4.6.tar.gz | tar xz
  - cd libshout-2.4.6 && PKG_CONFIG_PATH=$BENCH_ENV_DIR/build/lib/pkgconfig CC=gcc ./configure --prefix=$BENCH_ENV_DIR/build --disable-static --disable-theora --disable-speex && make -j8 install
  - curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 https://github.com/rtbrick/libdict/archive/refs/tags/1.0.7.tar.gz | tar xz
  - cmake -S libdict-1.0.7 -B libdict-build -DCMAKE_INSTALL_PREFIX=$BENCH_ENV_DIR/build -DCMAKE_C_COMPILER=gcc -DLIBDICT_TOOLS=NO -DLIBDICT_TESTS=NO && cmake --build libdict-build -j8 --target install
  - curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 https://netfilter.org/projects/libmnl/files/libmnl-1.0.5.tar.bz2 | tar xj
  - cd libmnl-1.0.5 && CC=gcc ./configure --prefix=$BENCH_ENV_DIR/build --disable-static && make -j8 install
  - curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 https://netfilter.org/projects/libnftnl/files/libnftnl-1.2.9.tar.xz | tar xJ
  - cd libnftnl-1.2.9 && PKG_CONFIG_PATH=$BENCH_ENV_DIR/build/lib/pkgconfig CC=gcc ./configure --prefix=$BENCH_ENV_DIR/build --disable-static && make -j8 install

# the compilers by their plain names, the environment's headers and libraries
# for the compiler, pkg-config and CMake, and their directory in the
# executable's runpath (conda's activation scripts, which set these, are not
# run); -pthread because the sysroot's glibc (2.28) keeps the threads in
# libpthread, where a current distribution has them in libc
env:
  CC: gcc
  CXX: g++
  CPATH: $BENCH_ENV_DIR/build/include
  LIBRARY_PATH: $BENCH_ENV_DIR/build/lib
  PKG_CONFIG_PATH: $BENCH_ENV_DIR/build/lib/pkgconfig:$BENCH_ENV_DIR/build/share/pkgconfig
  CMAKE_PREFIX_PATH: $BENCH_ENV_DIR/build
  LDFLAGS: -pthread -Wl,-rpath,$BENCH_ENV_DIR/build/lib
