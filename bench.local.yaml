# Run profile for a model served locally, with an OpenAI-compatible API
# (Ollama, vLLM, llama.cpp's llama-server):   make run PROFILE=bench.local.yaml
# Start the server first, with tool calling and a large context window:
#   Ollama:  OLLAMA_CONTEXT_LENGTH=65536 ollama serve   and   ollama pull <model>
#            (Ollama's default window is small and it cuts longer prompts silently)
#   vLLM:    vllm serve <model> --max-model-len 65536 --enable-auto-tool-choice --tool-call-parser <parser>
#   llama.cpp: llama-server -m <model.gguf> --jinja -c 65536
# make run checks that the server answers and serves the model before starting.

config: config/x86_64_to_ppc64le_power9.yaml
label: local1
repeats: 1
packages: [zita-resampler]

# the server's OpenAI-compatible API, and the model as the server names it
base_url: http://127.0.0.1:11434/v1
model: qwen3-coder:30b
# environment variable (or .env entry) with the server's key, if it needs one;
# the API key of .env is never sent to another server
api_key_env:
provider:

attempts: 3
temperature:

# conversation kept before the oldest tool results are shortened, in
# characters (about 3.5 per token): fit the server's context window, leaving
# room for the system prompt and the reply (65,536 tokens -> about 180,000)
context_chars: 180000
